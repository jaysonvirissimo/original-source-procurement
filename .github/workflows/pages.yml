name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI already ran pnpm check on this commit; rerunning it here only gives
      # timing-sensitive tests another chance to block the deploy.
      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @osp/game exec playwright install --with-deps chromium

      - name: Smoke test the build under a sub-path
        run: pnpm test:browser --project=chromium

      # Blocks the upload unless the built site ships the GPL-2.0-only compiler
      # artifacts verbatim, with license notices, exact provenance, and their
      # corresponding source.
      - name: Audit compiler artifact distribution
        run: pnpm audit:distribution

      # Blocks the upload if the built site holds a referenced upstream file,
      # a target line, or a run of a referenced target's words.
      - name: Audit the built site for upstream content
        run: pnpm audit:upstream

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/game/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
